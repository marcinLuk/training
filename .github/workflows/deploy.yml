# Test the app, publish the Docker image to GHCR and deploy it over SSH.
#
# Secrets (repository): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Variable (repository): DEPLOY_ENABLED. The deploy job runs only when it is 'true'.
# See docs/deploy.md for how to set them.
# Actions are pinned to full commit SHAs (a tag can be moved); the comment names the release.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in the order the pushes came. A running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-dist.mjs dist

  image:
    needs: test
    # A manual run from another branch must not publish an image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: training
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the image and run the smoke test
        run: bash scripts/smoke-image.sh "trening:ci"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the image
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GHCR needs a lowercase owner; github.repository_owner can have capitals.
          repo="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          docker tag trening:ci "${repo}:${SHA}"
          docker tag trening:ci "${repo}:latest"
          docker push "${repo}:${SHA}"
          docker push "${repo}:latest"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job needs no repository access and no token rights.
    permissions: {}
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="${RUNNER_TEMP}/deploy_key"
          known_hosts="${RUNNER_TEMP}/known_hosts"
          trap 'rm -f -- "$key" "$known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          # The server runs only deploy.sh for this key. The argument is the commit SHA.
          ssh -i "$key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "$SHA"
