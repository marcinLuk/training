# Included in EVERY location of default.conf. An add_header in a location
# cancels all add_header lines of the server level, so the headers repeat here.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# Only files from this origin. The build has no inline script or style and no eval.
# frame-ancestors 'none' blocks framing (clickjacking).
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# The app uses only the screen wake lock (FR-012). Every other listed feature is off.
add_header Permissions-Policy "screen-wake-lock=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# Browsers accept HSTS only over HTTPS. Traefik serves this response over HTTPS,
# so the header reaches the browser; on plain http (smoke test) it is ignored.
add_header Strict-Transport-Security "max-age=31536000" always;
