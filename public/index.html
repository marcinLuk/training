<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Dziennik treningowy</title>

</head>
<body>
  <header class="topbar">
    <h1>🏋️ Trening</h1>

</html>
